name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm libarchive-tools

      - name: Install dependencies
        run: npm ci

      - name: Verify lint baseline
        shell: bash
        run: node scripts/lint-baseline.js

      - name: Vite build
        run: npm run build

      - name: Package and Publish (Tag Push)
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npx electron-builder --publish always

      - name: Package only (Workflow Dispatch)
        if: github.event_name == 'workflow_dispatch'
        run: |
          npx electron-builder --publish never

      - name: Upload build artifacts (Workflow Dispatch)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: screen-buddy-${{ matrix.os }}
          path: |
            release/*.AppImage
            release/*.rpm
            release/*.deb
            release/*.exe
            release/*.yml
          if-no-files-found: error
