name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare:
    name: Validate Tag & Prepare Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify tag matches package.json version
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          TAG_VER="${GITHUB_REF_NAME#v}"
          PKG_VER="$(node -p "require('./package.json').version")"
          echo "Tag version: ${TAG_VER} | package.json version: ${PKG_VER}"
          if [ "$TAG_VER" != "$PKG_VER" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} (${TAG_VER}) does not match package.json version (${PKG_VER})."
            exit 1
          fi

      - name: Create GitHub release with generated notes
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --title "Screen Buddy $GITHUB_REF_NAME" --generate-notes
          fi

  build:
    name: Build & Package (${{ matrix.os }})
    needs: prepare
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm libarchive-tools

      - name: Install dependencies
        run: npm ci

      - name: Verify lint baseline
        shell: bash
        run: node scripts/lint-baseline.js

      - name: Vite build
        run: npm run build

      - name: Package and Publish (Tag Push)
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npx electron-builder --publish always

      - name: Package only (Workflow Dispatch)
        if: github.event_name == 'workflow_dispatch'
        run: |
          npx electron-builder --publish never

      - name: Upload build artifacts (Workflow Dispatch)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: screen-buddy-${{ matrix.os }}
          path: |
            release/*.AppImage
            release/*.rpm
            release/*.deb
            release/*.exe
            release/*.blockmap
            release/*.yml
          if-no-files-found: error
