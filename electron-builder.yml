appId: io.github.the-nullb0rn.screen-buddy
productName: Screen Buddy
copyright: Copyright © 2026 nullborn

npmRebuild: false

directories:
  output: release
  buildResources: build

files:
  - dist/**/*
  - dist-electron/**/*
  - assets/**/*
  - package.json
  - LICENSE
  - "!**/*.map"
  - "!tools/**"
  - "!**/*.py"
  - "!**/*.pyc"
  - "!docs/**"
  - "!release/**"

asar: true
asarUnpack:
  - "**/*.node"

publish:
  provider: github
  owner: THE-Nullb0rn
  repo: Screen-Buddy

win:
  target:
    - target: nsis
      arch:
        - x64
  artifactName: Screen-Buddy-Setup-${version}.${ext}
  icon: build/icon.ico

nsis:
  oneClick: true
  perMachine: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  runAfterFinish: true
  shortcutName: Screen Buddy

linux:
  maintainer: nullborn <nullborn@users.noreply.github.com>
  target:
    - target: AppImage
      arch:
        - x64
    - target: rpm
      arch:
        - x64
    - target: deb
      arch:
        - x64
  category: Utility
  executableName: screen-buddy
  icon: build/icons
  desktop:
    entry:
      StartupWMClass: screen-buddy

appImage:
  artifactName: Screen-Buddy-${version}-x86_64.${ext}

rpm:
  artifactName: Screen-Buddy-${version}-x86_64.${ext}

deb:
  artifactName: Screen-Buddy-${version}-amd64.${ext}
  recommends:
    - playerctl
